<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlowBridge — Login</title>
    <meta name="description" content="FlowBridge - Secure hybrid file transfer with E2E encryption, 2FA, and room-based transfers.">
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#6C63FF">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-box animate-fade-up" role="main" aria-label="Login form">
            <div class="auth-logo">
                <img src="/static/favicon.svg" alt="FlowBridge Logo" style="width: 60px; height: 60px;">
            </div>
            <h1 class="auth-title">FlowBridge</h1>
            <p class="auth-subtitle">Sign in to your account</p>

            <div id="errorMsg" class="alert alert-danger" style="display:none;" role="alert"></div>

            <!-- Login Form -->
            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label" for="username">Username</label>
                    <input class="form-input" type="text" id="username" name="username" placeholder="Enter your username" required autocomplete="username" aria-required="true">
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input class="form-input" type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password" aria-required="true">
                </div>

                <button type="submit" class="btn btn-primary btn-lg" id="loginBtn" style="width:100%;">
                    Sign In
                </button>
            </form>

            <!-- 2FA Step (hidden by default) -->
            <form id="twoFAForm" style="display:none;">
                <div style="text-align:center;margin-bottom:1rem;">
                    <div style="font-size:2.5rem;">🛡️</div>
                    <p style="color:var(--text-secondary);font-size:0.9rem;">Enter the 6-digit code from your authenticator app</p>
                </div>
                <div class="form-group">
                    <label class="form-label" for="totpCode">2FA Code</label>
                    <input class="form-input" type="text" id="totpCode" maxlength="6" placeholder="000000"
                           style="font-family:'JetBrains Mono',monospace;font-size:1.5rem;letter-spacing:0.4em;text-align:center;"
                           autocomplete="one-time-code" inputmode="numeric" required aria-label="Two-factor authentication code">
                </div>
                <button type="submit" class="btn btn-primary btn-lg" id="twoFABtn" style="width:100%;">
                    🔐 Verify & Sign In
                </button>
                <button type="button" class="btn btn-ghost" style="width:100%;margin-top:0.5rem;" onclick="backToLogin()">← Back</button>
            </form>

            <div class="auth-link">
                Don't have an account? <a href="/signup">Create one</a>
            </div>
        </div>
    </div>

    <script>
        // Check if already logged in
        const existingToken = localStorage.getItem('token');
        if (existingToken) {
            fetch('/api/auth/verify', {
                headers: { 'Authorization': 'Bearer ' + existingToken }
            }).then(r => r.json()).then(d => {
                if (d.success) window.location.href = '/dashboard';
            }).catch(() => {});
        }

        const form = document.getElementById('loginForm');
        const errorMsg = document.getElementById('errorMsg');
        const loginBtn = document.getElementById('loginBtn');
        let pending2FAUserId = null;

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.style.display = 'none';
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span class="spinner">⟳</span> Signing in...';

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (data.success) {
                    if (data.needs_2fa) {
                        // Show 2FA form
                        pending2FAUserId = data.user_id;
                        document.getElementById('loginForm').style.display = 'none';
                        document.getElementById('twoFAForm').style.display = 'block';
                        document.getElementById('totpCode').focus();
                    } else {
                        // Direct login
                        localStorage.setItem('token', data.token);
                        localStorage.setItem('refresh_token', data.refresh_token);
                        localStorage.setItem('user', JSON.stringify(data.user));
                        window.location.href = '/dashboard';
                    }
                } else {
                    errorMsg.textContent = data.error || 'Login failed';
                    errorMsg.style.display = 'block';
                }
            } catch (error) {
                errorMsg.textContent = 'Connection error. Please try again.';
                errorMsg.style.display = 'block';
            }

            loginBtn.disabled = false;
            loginBtn.innerHTML = 'Sign In';
        });

        // 2FA verification
        document.getElementById('twoFAForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const code = document.getElementById('totpCode').value.trim();
            if (code.length !== 6) return;

            const btn = document.getElementById('twoFABtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner">⟳</span> Verifying...';

            try {
                const res = await fetch('/api/auth/2fa/validate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: pending2FAUserId, code })
                });
                const data = await res.json();

                if (data.success) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('refresh_token', data.refresh_token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    window.location.href = '/dashboard';
                } else {
                    errorMsg.textContent = data.error || 'Invalid 2FA code';
                    errorMsg.style.display = 'block';
                }
            } catch {
                errorMsg.textContent = 'Verification failed';
                errorMsg.style.display = 'block';
            }

            btn.disabled = false;
            btn.innerHTML = '🔐 Verify & Sign In';
        });

        function backToLogin() {
            document.getElementById('twoFAForm').style.display = 'none';
            document.getElementById('loginForm').style.display = 'block';
            errorMsg.style.display = 'none';
        }

        // Register service worker (PWA)
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/static/sw.js').catch(() => {});
        }
    </script>
</body>
</html>
