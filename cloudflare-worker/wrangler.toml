name = "flowbridge-lb"
main = "worker.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# Deployed at: https://flowbridge-lb.<your-cf-subdomain>.workers.dev
# No custom domain needed — workers.dev is free and works globally

# ── KV Namespace — health state, circuit breaker, metrics, rate limits ─────────
[[kv_namespaces]]
binding = "FLOWBRIDGE_KV"
id = "5359029bb5dc42cbb7161837d149ed70"

# ── Cron Trigger — active health checks every 1 minute (CF minimum) ────────────
[triggers]
crons = ["*/1 * * * *"]

[vars]
ENVIRONMENT = "production"
