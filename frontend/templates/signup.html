<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlowBridge — Sign Up</title>
    <meta name="description" content="Create your FlowBridge account for secure file transfers.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-box animate-fade-up">
            <div class="auth-logo">
                <img src="/static/favicon.svg" alt="FlowBridge Logo" style="width: 60px; height: 60px;">
            </div>
            <h1 class="auth-title">FlowBridge</h1>
            <p class="auth-subtitle">Create your account</p>

            <div id="errorMsg" class="alert alert-error" style="display:none;"></div>
            <div id="successMsg" class="alert alert-success" style="display:none;"></div>

            <form id="signupForm">
                <div class="form-group">
                    <label class="form-label" for="username">Username</label>
                    <input class="form-input" type="text" id="username" placeholder="Choose a username (3-30 chars)" required minlength="3" maxlength="30" autocomplete="username">
                </div>

                <div class="form-group">
                    <label class="form-label" for="email">Email</label>
                    <input class="form-input" type="email" id="email" placeholder="your@email.com" required autocomplete="email">
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input class="form-input" type="password" id="password" placeholder="Min 8 chars, 1 uppercase, 1 digit" required minlength="8" autocomplete="new-password">
                    <div id="passwordStrength" style="margin-top:0.4rem; font-size:0.8rem; color:var(--text-muted);"></div>
                </div>

                <button type="submit" class="btn btn-primary btn-lg" id="signupBtn" style="width:100%;">
                    Create Account
                </button>
            </form>

            <div class="auth-link">
                Already have an account? <a href="/login">Sign in</a>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('signupForm');
        const errorMsg = document.getElementById('errorMsg');
        const successMsg = document.getElementById('successMsg');
        const signupBtn = document.getElementById('signupBtn');

        // Password strength indicator
        document.getElementById('password').addEventListener('input', function() {
            const pw = this.value;
            const indicator = document.getElementById('passwordStrength');
            let strength = 0;
            if (pw.length >= 8) strength++;
            if (pw.length >= 12) strength++;
            if (/[A-Z]/.test(pw)) strength++;
            if (/[0-9]/.test(pw)) strength++;
            if (/[^A-Za-z0-9]/.test(pw)) strength++;

            const labels = ['', '⚠️ Weak', '⚠️ Fair', '✓ Good', '✓ Strong', '✓ Very Strong'];
            const colors = ['', 'var(--danger)', 'var(--warning)', 'var(--success)', 'var(--success)', 'var(--success)'];
            indicator.textContent = labels[strength] || '';
            indicator.style.color = colors[strength] || '';
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';
            signupBtn.disabled = true;
            signupBtn.innerHTML = '<span class="spinner">⟳</span> Creating...';

            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/api/auth/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password })
                });

                const data = await response.json();

                if (data.success) {
                    successMsg.textContent = '✓ Account created! Redirecting to login...';
                    successMsg.style.display = 'flex';
                    setTimeout(() => window.location.href = '/login', 1500);
                } else {
                    errorMsg.textContent = data.error || 'Signup failed';
                    errorMsg.style.display = 'flex';
                }
            } catch (error) {
                errorMsg.textContent = 'Connection error. Please try again.';
                errorMsg.style.display = 'flex';
            }

            signupBtn.disabled = false;
            signupBtn.innerHTML = 'Create Account';
        });
    </script>
</body>
</html>
