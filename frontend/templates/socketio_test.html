<!DOCTYPE html>
<html>
<head>
    <title>Socket.IO Test</title>
    <style>
        body { font-family: Arial; padding: 2rem; background: #1e1e1e; color: #fff; }
        .status { padding: 1rem; margin: 1rem 0; border-radius: 8px; }
        .success { background: #2d5016; border: 2px solid #4caf50; }
        .error { background: #5c1a1a; border: 2px solid #f44336; }
        .warning { background: #5c4a1a; border: 2px solid #ff9800; }
        pre { background: #000; padding: 1rem; border-radius: 4px; overflow-x: auto; }
        button { padding: 0.5rem 1rem; margin: 0.5rem; cursor: pointer; }
    </style>
</head>
<body>
    <h1>🔧 Socket.IO Diagnostic Test</h1>
    
    <div id="status" class="status warning">
        <h3>⏳ Testing Socket.IO...</h3>
        <p>Please wait...</p>
    </div>

    <div id="details"></div>

    <h3>Actions:</h3>
    <button onclick="testAPI()">Test API Connection</button>
    <button onclick="testWebSocket()">Test WebSocket</button>
    <button onclick="location.reload()">Refresh Test</button>
    <button onclick="location.href='/codeshare'">Go to CodeShare</button>

    <h3>Console Output:</h3>
    <pre id="console"></pre>

    <script>
        const log = [];
        function addLog(msg, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const line = `[${timestamp}] ${type.toUpperCase()}: ${msg}`;
            log.push(line);
            document.getElementById('console').textContent = log.join('\n');
            console.log(msg);
        }

        // Test Socket.IO loading
        setTimeout(() => {
            const statusDiv = document.getElementById('status');
            const detailsDiv = document.getElementById('details');
            
            if (typeof io !== 'undefined') {
                statusDiv.className = 'status success';
                statusDiv.innerHTML = `
                    <h3>✅ Socket.IO Loaded Successfully!</h3>
                    <p>Real-time features will work.</p>
                `;
                addLog('Socket.IO is available', 'success');
                addLog('Version: ' + (io.version || 'unknown'), 'info');
                
                detailsDiv.innerHTML = `
                    <div class="status success">
                        <h4>Socket.IO Details:</h4>
                        <ul>
                            <li>Library: Loaded ✅</li>
                            <li>Function: ${typeof io}</li>
                            <li>Ready: Yes</li>
                        </ul>
                    </div>
                `;
            } else {
                statusDiv.className = 'status error';
                statusDiv.innerHTML = `
                    <h3>❌ Socket.IO Failed to Load</h3>
                    <p>Real-time features will not work (offline mode).</p>
                `;
                addLog('Socket.IO is NOT available', 'error');
                addLog('Editor will work in offline mode', 'warning');
                
                detailsDiv.innerHTML = `
                    <div class="status error">
                        <h4>Possible Causes:</h4>
                        <ul>
                            <li>CDN blocked by network/firewall</li>
                            <li>Internet connection issue</li>
                            <li>Ad blocker blocking scripts</li>
                            <li>Browser security settings</li>
                        </ul>
                        <h4>Solutions:</h4>
                        <ul>
                            <li>Try different browser</li>
                            <li>Disable ad blocker</li>
                            <li>Check browser console (F12)</li>
                            <li>Use offline mode (editor still works!)</li>
                        </ul>
                    </div>
                `;
            }
        }, 1000);

        async function testAPI() {
            addLog('Testing API connection...', 'info');
            try {
                const res = await fetch('/api/codeshare/test123');
                addLog(`API Response: ${res.status} ${res.statusText}`, res.ok ? 'success' : 'warning');
                const data = await res.json();
                addLog(`API Data: ${JSON.stringify(data)}`, 'info');
            } catch (error) {
                addLog(`API Error: ${error.message}`, 'error');
            }
        }

        function testWebSocket() {
            addLog('Testing WebSocket connection...', 'info');
            if (typeof io === 'undefined') {
                addLog('Cannot test WebSocket - Socket.IO not loaded', 'error');
                return;
            }
            
            try {
                const socket = io();
                
                socket.on('connect', () => {
                    addLog('WebSocket connected successfully!', 'success');
                    addLog(`Socket ID: ${socket.id}`, 'info');
                    socket.disconnect();
                });
                
                socket.on('connect_error', (error) => {
                    addLog(`WebSocket connection error: ${error.message}`, 'error');
                });
                
                socket.on('disconnect', () => {
                    addLog('WebSocket disconnected', 'info');
                });
            } catch (error) {
                addLog(`WebSocket test failed: ${error.message}`, 'error');
            }
        }

        // Try loading Socket.IO
        addLog('Starting Socket.IO load test...', 'info');
        const sources = [
            'https://cdn.socket.io/4.5.4/socket.io.min.js',
            'https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.5.4/socket.io.min.js',
            '/socket.io/socket.io.js'
        ];

        let currentIndex = 0;
        function loadNextSource() {
            if (currentIndex >= sources.length) {
                addLog('All Socket.IO sources failed', 'error');
                return;
            }
            
            const src = sources[currentIndex];
            addLog(`Trying to load from: ${src}`, 'info');
            
            const script = document.createElement('script');
            script.src = src;
            script.onload = () => {
                addLog(`Successfully loaded from: ${src}`, 'success');
            };
            script.onerror = () => {
                addLog(`Failed to load from: ${src}`, 'error');
                currentIndex++;
                loadNextSource();
            };
            document.head.appendChild(script);
        }
        
        loadNextSource();
    </script>
</body>
</html>
